[package]
name = "helab-convert-rs"
version = "0.1.0"
edition = "2021"
description = "HeLab's TXY converter, rust backend: MATLAB's 4-corner reconstruction, byte for byte"
license = "MIT"
publish = false

[lib]
name = "helab_convert_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# abi3-py311: one wheel per OS and architecture serves Python 3.11 and later.
pyo3 = { version = "0.30", features = ["abi3-py311"] }
numpy = "0.30"

[profile.release]
lto = "fat"
codegen-units = 1
# unwind, not abort: a panic becomes a Python exception (PyO3's PanicException) instead of
# killing the process (a helper, say).
panic = "unwind"
strip = true
