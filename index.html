<!DOCTYPE html>
<!-- The manual site's front page until there is a stable release (Q56.3): mike's set-default template
     (docs/publish/site_versions.py), pre-release/ being the newest pre-release's manual. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HeLab manual</title>
  <style>
    :root { color-scheme: light dark; --text: #1f2328; --muted: #59636e; --link: #3f51b5; --page: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --text: #e6edf3; --muted: #9198a1; --link: #8c9eff; --page: #1e2129; }
    }
    body { margin: 0; background: var(--page); color: var(--text);
           font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 36rem; margin: 15vh auto 0; padding: 0 16px; }
    h1 { font-size: 1.6rem; margin: 0 0 0.5rem; }
    p { margin: 0.5rem 0; }
    .note { color: var(--muted); }
    a { color: var(--link); }
  </style>
</head>
<body>
  <main>
    <h1>No stable release yet</h1>
    <p>HeLab has only pre-releases (alpha and beta versions) so far. Read the
      <a href="pre-release/">newest pre-release's manual</a>; its version menu lists every release.</p>
    <p class="note">HeLab's Help › User manual opens the manual of the version you run.</p>
  </main>
</body>
</html>
