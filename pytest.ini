[pytest]
# Test the checkout pytest runs in: its folder goes first on sys.path, before an editable install
# or PYTHONPATH that names another checkout's helab (a floor's venv copied from Ground).
pythonpath = .
# A test still running after this long dumps every thread's stack (it goes on): CI's
# `--timeout=120 --timeout-method=thread` kills the worker without one under xdist, which then
# reads as "worker crashed" ("node down: Not properly terminated").
faulthandler_timeout = 100
# No pytest-qt Qt log capture: its per-test swap of Qt's message handler raced with QtWebEngine
# logging from another thread (Ubuntu CI: "'NoneType' object is not callable" at teardown). Qt
# messages go to stderr, which pytest captures ("Captured stderr call").
addopts = --no-qt-log
