name: CI test

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      python-minor:
        required: true
        type: string
      enabled:
        description: Run this job; false records a skip without starting a runner
        type: boolean
        default: true
      experimental:
        description: Allow compatibility failures without failing CI
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false
      HF_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  # The converter's compiled backend (Q11.2: numpy, cython and the reference ship): cython's kernel
  # built for this Python and required (HELAB_REQUIRE_BACKENDS=cython: a kernel that can't load
  # fails, as does a test that skips naming it), checked against the reference, and the converter's
  # backend tests run with it. Numba, mlx and rust don't ship (A9.1): not installed, their tests skip.
  # In a job of its own: the main test job runs without Cython, as before the backends shipped.
  backends:
    name: Converter backends
    if: inputs.enabled
    runs-on: ${{ inputs.os }}-latest
    timeout-minutes: 20
    continue-on-error: ${{ inputs.experimental }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies on Ubuntu
        if: inputs.os == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            xvfb \
            x11-utils \
            libopengl0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.${{ inputs.python-minor }}
          cache: 'pip'

      - name: Get HeLab's test data
        uses: ./.github/actions/testdata
        with:
          token: ${{ secrets.HF_TOKEN }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m venv venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            source venv/Scripts/activate
          else
            source venv/bin/activate
          fi
          python -m pip install --upgrade pip
          if [ "${{ inputs.python-minor }}" = "13" ] && [ -f requirements.lock ]; then
            pip install -r requirements.lock
          else
            pip install -r requirements.txt
          fi
          pip install -e .

      - name: Build and check the converter's cython backend
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            source venv/Scripts/activate
          else
            source venv/bin/activate
          fi
          python native/build.py --ci

      - name: Run the converter's tests with the cython backend
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            source venv/Scripts/activate
          else
            source venv/bin/activate
          fi
          # The converter's tests that run a backend (each backend's own, the helper's, the
          # within-shot split and the test data's, which go through every available one; the unshipped ones skip; and the
          # raw layer's, which converts from it with every available one); the reader, writer,
          # profile and reference tests use none and run in the main job.
          pytest tests/test_convert_backend_*.py tests/test_convert_required_backends.py \
            tests/test_convert_helab.py tests/test_convert_split.py tests/test_convert_testdata.py tests/test_raw_layer.py \
            -n 4 -rR --reruns 5 --reruns-delay 5 --timeout=120 --timeout-method=thread

  test:
    # Skipped jobs may leave input expressions unevaluated in their names.
    # The caller's matrix name identifies the OS and Python version; GitHub adds the group: "Tests (1/2)".
    name: Tests
    if: inputs.enabled
    runs-on: ${{ inputs.os }}-latest
    # The suite in two groups, each a job of its own (Q16.2): every test is in exactly one, by a
    # hash of its node ID (tests/conftest.py, --test-group), and the caller's result (the release
    # gate's needs) is a failure if either group fails. Both keep running if the other fails.
    strategy:
      fail-fast: false
      matrix:
        group: ['1/2', '2/2']
    # The whole suite took about 5-10 min by OS and runner (Windows 20-25), so a group about half;
    # the limit catches a hang: 30 min on Windows (Q2.6), 20 elsewhere.
    timeout-minutes: ${{ inputs.os == 'windows' && 30 || 20 }}
    continue-on-error: ${{ inputs.experimental }}
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies on Ubuntu
        if: inputs.os == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            xvfb \
            x11-utils \
            libopengl0

      - name: Install dependencies on macOS
        if: inputs.os == 'macos'
        run: |
          echo "No dependencies to install on macOS."

      - name: Install dependencies on Windows
        if: inputs.os == 'windows'
        run: |
          echo "No dependencies to install on Windows."

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.${{ inputs.python-minor }}
          cache: 'pip'

      - name: Get HeLab's test data
        uses: ./.github/actions/testdata
        with:
          token: ${{ secrets.HF_TOKEN }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m venv venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            source venv/Scripts/activate
          else
            source venv/bin/activate
          fi
          python -m pip install --upgrade pip
          # Python 3.13 (required) installs the pinned lock; compatibility jobs, and a recovery
          # build of a tag older than the lock, install requirements.txt unpinned. Both without
          # the converter's optional backends and their build tools: the backends job tests those,
          # and this suite runs in the environment it had before they shipped (their tests skip).
          optional='^(numba|llvmlite|mlx|mlx-metal|cython|maturin)([^a-z0-9_.-]|$)'
          if [ "${{ inputs.python-minor }}" = "13" ] && [ -f requirements.lock ]; then
            grep -v -i -E "$optional" requirements.lock > "$RUNNER_TEMP/requirements-tests.txt"
          else
            grep -v -i -E "$optional" requirements.txt > "$RUNNER_TEMP/requirements-tests.txt"
          fi
          pip install -r "$RUNNER_TEMP/requirements-tests.txt"
          pip install -e .
          pip list | grep -i -E "$optional" && { echo "::error::a converter backend package is installed"; exit 1; } || true

      - name: Run Tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            source venv/Scripts/activate
          else
            source venv/bin/activate
          fi
          # One run gives the group's results and coverage (pytest-cov merges the xdist workers'
          # data); macOS uploads each group's coverage.xml below, and Codecov merges the two uploads.
          pytest -n 4 --test-group "${{ matrix.group }}" --verbose -rR --cache-clear --cov=helab --cov-report=xml --cov-report=term --junitxml=junit.xml -o junit_family=legacy --reruns 5 --reruns-delay 5 --timeout=120 --timeout-method=thread

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

      - name: Upload Code Coverage Report
        if: inputs.python-minor == '13' && inputs.os == 'macos'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Report Python 3.13 test failure
        if: inputs.python-minor == '13' && failure() && !cancelled()
        shell: bash
        env:
          MATRIX_OS: ${{ inputs.os }}
          PYTHON_MINOR: ${{ inputs.python-minor }}
          TEST_GROUP: ${{ matrix.group }}
        run: |
          echo "::error title=Python 3.${PYTHON_MINOR} test group ${TEST_GROUP} failed on ${MATRIX_OS}::Required test job (group ${TEST_GROUP}) failed on ${MATRIX_OS}-latest (${RUNNER_OS}/${RUNNER_ARCH}) with Python 3.${PYTHON_MINOR}. Other configurations will continue; inspect this job's failed step for the cause."
          {
            echo "### Required test job failed"
            echo ""
            echo "- **OS target:** ${MATRIX_OS}-latest"
            echo "- **Python target:** 3.${PYTHON_MINOR}"
            echo "- **Test group:** ${TEST_GROUP}"
            echo "- **Runner:** ${RUNNER_OS} / ${RUNNER_ARCH}"
            echo ""
            echo "Other configurations will continue. Inspect **${MATRIX_OS} + py3.${PYTHON_MINOR} / Tests (${TEST_GROUP})** in the [job logs](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}) for the failed step."
          } >> "$GITHUB_STEP_SUMMARY"
