name: CI test

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      python-minor:
        required: true
        type: string
      enabled:
        description: Run this job; false records a skip without starting a runner
        type: boolean
        default: true
      experimental:
        description: Allow compatibility failures without failing CI
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  # The converter's backends (Q9.2): cython's kernel and rust's module built for this Python,
  # numba and mlx installed, all of them required (HELAB_REQUIRE_BACKENDS: one that can't load
  # fails, as does a test that skips naming one), checked against the reference, and the
  # converter's tests run with them. In a job of its own: the main test job runs without them, as
  # before the backends shipped, so its time is what it was (their tests skip there).
  backends:
    name: Converter backends
    if: inputs.enabled
    runs-on: ${{ inputs.os }}-latest
    timeout-minutes: 20
    continue-on-error: ${{ inputs.experimental }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies on Ubuntu
        if: inputs.os == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            xvfb \
            x11-utils \
            libopengl0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.${{ inputs.python-minor }}
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m venv venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            source venv/Scripts/activate
          else
            source venv/bin/activate
          fi
          python -m pip install --upgrade pip
          if [ "${{ inputs.python-minor }}" = "13" ] && [ -f requirements.lock ]; then
            pip install -r requirements.lock
          else
            pip install -r requirements.txt
          fi
          pip install -e .

      - name: Build and check the converter backends
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            source venv/Scripts/activate
          else
            source venv/bin/activate
          fi
          python native/build.py --ci

      - name: Run the converter's tests with every backend
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            source venv/Scripts/activate
          else
            source venv/bin/activate
          fi
          pytest tests/test_convert_*.py -n 4 -rR --reruns 5 --reruns-delay 5 --timeout=120 --timeout-method=thread

  test:
    # Skipped jobs may leave input expressions unevaluated in their names.
    # The caller's matrix name identifies the OS and Python version.
    name: Tests
    if: inputs.enabled
    runs-on: ${{ inputs.os }}-latest
    # The suite takes about 5-10 min by OS and runner (Windows 20-24); the limit catches a hang:
    # 30 min on Windows (Q2.6), 20 elsewhere.
    timeout-minutes: ${{ inputs.os == 'windows' && 30 || 20 }}
    continue-on-error: ${{ inputs.experimental }}
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies on Ubuntu
        if: inputs.os == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            xvfb \
            x11-utils \
            libopengl0

      - name: Install dependencies on macOS
        if: inputs.os == 'macos'
        run: |
          echo "No dependencies to install on macOS."

      - name: Install dependencies on Windows
        if: inputs.os == 'windows'
        run: |
          echo "No dependencies to install on Windows."

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.${{ inputs.python-minor }}
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m venv venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            source venv/Scripts/activate
          else
            source venv/bin/activate
          fi
          python -m pip install --upgrade pip
          # Python 3.13 (required) installs the pinned lock; compatibility jobs, and a recovery
          # build of a tag older than the lock, install requirements.txt unpinned. Both without
          # the converter's optional backends and their build tools: the backends job tests those,
          # and this suite runs in the environment it had before they shipped (their tests skip).
          optional='^(numba|llvmlite|mlx|mlx-metal|cython|maturin)([^a-z0-9_.-]|$)'
          if [ "${{ inputs.python-minor }}" = "13" ] && [ -f requirements.lock ]; then
            grep -v -i -E "$optional" requirements.lock > "$RUNNER_TEMP/requirements-tests.txt"
          else
            grep -v -i -E "$optional" requirements.txt > "$RUNNER_TEMP/requirements-tests.txt"
          fi
          pip install -r "$RUNNER_TEMP/requirements-tests.txt"
          pip install -e .
          pip list | grep -i -E "$optional" && { echo "::error::a converter backend package is installed"; exit 1; } || true

      - name: Run Tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            source venv/Scripts/activate
          else
            source venv/bin/activate
          fi
          # One run gives the results and the coverage (pytest-cov merges the xdist workers' data);
          # macOS uploads its coverage.xml below.
          pytest -n 4 --verbose -rR --cache-clear --cov=helab --cov-report=xml --cov-report=term --junitxml=junit.xml -o junit_family=legacy --reruns 5 --reruns-delay 5 --timeout=120 --timeout-method=thread

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

      - name: Upload Code Coverage Report
        if: inputs.python-minor == '13' && inputs.os == 'macos'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Report Python 3.13 test failure
        if: inputs.python-minor == '13' && failure() && !cancelled()
        shell: bash
        env:
          MATRIX_OS: ${{ inputs.os }}
          PYTHON_MINOR: ${{ inputs.python-minor }}
        run: |
          echo "::error title=Python 3.${PYTHON_MINOR} test failed on ${MATRIX_OS}::Required test job failed on ${MATRIX_OS}-latest (${RUNNER_OS}/${RUNNER_ARCH}) with Python 3.${PYTHON_MINOR}. Other configurations will continue; inspect this job's failed step for the cause."
          {
            echo "### Required test job failed"
            echo ""
            echo "- **OS target:** ${MATRIX_OS}-latest"
            echo "- **Python target:** 3.${PYTHON_MINOR}"
            echo "- **Runner:** ${RUNNER_OS} / ${RUNNER_ARCH}"
            echo ""
            echo "Other configurations will continue. Inspect **${MATRIX_OS} + py3.${PYTHON_MINOR} / Tests** in the [job logs](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}) for the failed step."
          } >> "$GITHUB_STEP_SUMMARY"
