name: CI CD

on:
  push:
    branches: "**"
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  get-version:
    name: Detect branch and version bump
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.compare.outputs.tag_name }}
      should_release: ${{ steps.compare.outputs.should_release }}
      prerelease: ${{ steps.compare.outputs.prerelease }}
      release_sha: ${{ steps.compare.outputs.release_sha }}
      build_sha: ${{ steps.compare.outputs.build_sha }}
      build_ref: ${{ steps.compare.outputs.build_ref }}
      build_branch: ${{ steps.compare.outputs.build_branch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install packaging
        run: pip install packaging

      - name: Validate package version and select main-branch release
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m helab.release

  # Required coverage runs to completion on every OS, even after a failure.
  test:
    name: Required tests (${{ matrix.os }}, Python 3.13)
    needs: get-version
    strategy:
      fail-fast: false
      matrix:
        os: [macos, windows, ubuntu]
    uses: ./.github/workflows/ci-test.yml
    with:
      os: ${{ matrix.os }}
      python-minor: '13'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Required builds (${{ matrix.os }}, Python 3.13)
    needs: get-version
    strategy:
      fail-fast: false
      matrix:
        os: [macos, windows, ubuntu]
    uses: ./.github/workflows/ci-build.yml
    with:
      os: ${{ matrix.os }}
      python-minor: '13'
      build-sha: ${{ needs.get-version.outputs.build_sha }}
      build-ref: ${{ needs.get-version.outputs.build_ref }}
      build-branch: ${{ needs.get-version.outputs.build_branch }}

  # Expand compatibility entries so the graph can display each skipped job.
  # The called jobs start runners only for PRs targeting main.
  test-compatibility:
    name: Compatibility tests (${{ matrix.os }}, Python 3.${{ matrix.python3-version }})
    needs: get-version
    strategy:
      fail-fast: false
      matrix:
        os: [macos, windows, ubuntu]
        python3-version: ['11', '12', '14']
    uses: ./.github/workflows/ci-test.yml
    with:
      os: ${{ matrix.os }}
      python-minor: ${{ matrix.python3-version }}
      enabled: ${{ github.event_name == 'pull_request' }}
      experimental: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build-compatibility:
    name: Compatibility builds (${{ matrix.os }}, Python 3.${{ matrix.python3-version }})
    needs: get-version
    strategy:
      fail-fast: false
      matrix:
        os: [macos, windows, ubuntu]
        python3-version: ['11', '12', '14']
    uses: ./.github/workflows/ci-build.yml
    with:
      os: ${{ matrix.os }}
      python-minor: ${{ matrix.python3-version }}
      enabled: ${{ github.event_name == 'pull_request' }}
      experimental: true
      build-sha: ${{ needs.get-version.outputs.build_sha }}
      build-ref: ${{ needs.get-version.outputs.build_ref }}
      build-branch: ${{ needs.get-version.outputs.build_branch }}

  release:
    name: Tag tested main commit and create draft release
    needs: [get-version, test, build, test-compatibility, build-compatibility]
    # Compatibility jobs are skipped on pushes and remain non-blocking.
    # An explicit status check lets skipped dependencies reach this gate.
    if: >-
      !cancelled() &&
      needs.get-version.result == 'success' &&
      needs.test.result == 'success' &&
      needs.build.result == 'success' &&
      needs.get-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    # Serialize tag creation and retain pending releases instead of replacing them.
    concurrency:
      group: helab-release
      queue: max
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ needs.get-version.outputs.tag_name }}
      RELEASE_SHA: ${{ needs.get-version.outputs.release_sha }}
      RELEASE_PRERELEASE: ${{ needs.get-version.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout current release tooling with current tags
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python for release validation and recovery
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Download macOS Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: build-macos-py313
          path: dist/macos

      - name: Download Windows Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: build-windows-py313
          path: dist/windows

      - name: Download Ubuntu Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: build-ubuntu-py313
          path: dist/ubuntu

      - name: Compress macOS Build Artifact
        run: |
          mkdir -p dist/release
          cd dist/macos
          zip -r -9 ../release/HeLab-macos.zip HeLab.app HeLab

      - name: Compress Windows Build Artifact
        run: |
          cd dist/windows
          zip -r -9 ../release/HeLab-windows.zip HeLab
          
      - name: Compress Ubuntu Build Artifact
        run: |
          cd dist/ubuntu
          zip -r -9 ../release/HeLab-ubuntu.zip HeLab

      - name: Verify all packaged commits before creating a tag
        run: python -m helab.release_draft --validate-only --tag "$RELEASE_TAG" --commit "$RELEASE_SHA" --artifacts dist/release

      - name: Create release tag explicitly after assets are prepared
        shell: bash
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tagged_commit=$(git rev-list -n 1 "$RELEASE_TAG")
            if [ "$tagged_commit" != "$RELEASE_SHA" ]; then
              echo "::error::Release tag $RELEASE_TAG already points to another commit."
              exit 1
            fi
          else
            git tag "$RELEASE_TAG" "$RELEASE_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Prepare Release Body
        run: |
          RELEASE_BODY="## Release ${{ needs.get-version.outputs.tag_name }}

          **Date:** $(date +'%Y-%m-%d %H:%M') UTC

          **Commit:** [$RELEASE_SHA](${{ github.server_url }}/${{ github.repository }}/commit/$RELEASE_SHA)

          **Workflow Run:** [View Details](${{ github.event.repository.url }}/actions/runs/${{ github.run_id }})

          ### Build Artifacts

          - **macOS ARM64** build (Python 3.13)
          - **Windows Intel64** build (Python 3.13)
          - **Ubuntu Intel64** build (Python 3.13)

          **Note:** This is an automated release. Please verify builds before production use."

          printf '%s\n' "$RELEASE_BODY" > dist/release-body.md

          echo "Release body preview:"
          echo "$RELEASE_BODY"

      - name: Create or resume the draft and its verified assets
        run: python -m helab.release_draft --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --commit "$RELEASE_SHA" --prerelease "$RELEASE_PRERELEASE" --artifacts dist/release --body dist/release-body.md

