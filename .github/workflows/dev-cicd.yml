name: CI CD

on:
  push:
    branches: "**"
    tags: 'v*.*.*'

permissions:
  contents: write

jobs:
  get-version:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.compare.outputs.tag_name }}
      should_release: ${{ steps.compare.outputs.should_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install packaging
        run: pip install packaging

      - name: Compare setup.py version against existing tags
        id: compare
        shell: python
        run: |
          import os
          import re
          import subprocess
          from packaging.version import Version, InvalidVersion

          with open("setup.py") as f:
              content = f.read()
          match = re.search(r'version\s*=\s*["\']([^"\']+)["\']', content)
          if not match:
              raise SystemExit("Could not find version= in setup.py")
          raw_version = match.group(1)
          current = Version(raw_version)
          tag_name = f"v{raw_version}"

          existing_tags = subprocess.run(
              ["git", "tag", "-l"], capture_output=True, text=True, check=True
          ).stdout.splitlines()

          latest_version = None
          latest_tag = None
          for t in existing_tags:
              if not t.startswith("v"):
                  continue
              try:
                  v = Version(t[1:])
              except InvalidVersion:
                  continue
              if latest_version is None or v > latest_version:
                  latest_version = v
                  latest_tag = t

          print(f"setup.py version: {raw_version} ({tag_name})")
          print(f"latest tagged version: {latest_tag or '(none)'}")

          if latest_version is not None and current < latest_version:
              raise SystemExit(
                  f"::error::setup.py version {raw_version} is lower than latest "
                  f"tagged version {latest_tag}. Version must not decrease."
              )

          tag_exists = tag_name in existing_tags
          on_main = os.environ["GITHUB_REF"] == "refs/heads/main"
          should_release = on_main and not tag_exists

          if tag_exists:
              print(f"Tag {tag_name} already exists, skipping release.")
          elif not on_main:
              print(f"Version {raw_version} not yet tagged, but not on main; skipping release.")
          else:
              print(f"Will tag and release {tag_name}.")

          gh_output = os.environ["GITHUB_OUTPUT"]
          with open(gh_output, "a") as f:
              f.write(f"tag_name={tag_name}\n")
              f.write(f"should_release={'true' if should_release else 'false'}\n")

  test:
    # name: Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    name: Test on ${{ matrix.os }} py3.${{ matrix.python3-version }}
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 15
    # continue-on-error: true  # Allow continue to build even if tests fail
    continue-on-error: ${{ matrix.python3-version != '13' }}
    strategy:
      matrix:
        os: [macos, windows, ubuntu]
        # os: [macos, windows]
        # python3-version: ["9", "10", "11", "12", "13", "14"]
        python3-version: ["11", "12", "13", "14"]
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # - name: Cache pip
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.cache/pip
      #     key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}-py${{ matrix.python-version }}

      # Install system dependencies for Ubuntu
      - name: Install dependencies on Ubuntu
        if: matrix.os == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            xvfb \
            x11-utils \
            libopengl0

      # For macOS, run a no-op command
      - name: Install dependencies on macOS
        if: matrix.os == 'macos'
        run: |
          echo "No dependencies to install on macOS."

      # For Windows, run a no-op command
      - name: Install dependencies on Windows
        if: matrix.os == 'windows'
        run: |
          echo "No dependencies to install on Windows."

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.${{ matrix.python3-version }}
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m venv venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            source venv/Scripts/activate
          else
            source venv/bin/activate
          fi
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pip install --force-reinstall -r requirements.txt
          pip install -e .

      - name: Run Tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            source venv/Scripts/activate
          else
            source venv/bin/activate
          fi
            pytest -n 4 --verbose --cache-clear --cov=helab --junitxml=junit.xml -o junit_family=legacy --reruns 5 --reruns-delay 2 --timeout=120 --timeout-method=thread

#          pytest -n 1 -v --cache-clear --cov=helab --junitxml=junit.xml -o junit_family=legacy
#          pytest -n 8 -v --cache-clear --cov=helab --junit-xml=pytest-report.xml
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-py3${{ matrix.python3-version }}
          path: junit.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

      - name: Run test with code coverage report
        if: matrix.python3-version == '13' && matrix.os == 'macos'
        run: |  
          source venv/bin/activate
          pytest --cov=helab --cov-report=xml --cov-report=term --ignore=tests/test_typing.py --cache-clear --timeout=120 --timeout-method=thread

      - name: Upload Code Coverage Report
        if: matrix.python3-version == '13' && matrix.os == 'macos'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Check Python 3.13 Test Results
        if: matrix.python3-version == '13' && failure()
        run: exit 1

  build:
    # name: Build on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    # needs: test # speed up parallel jobs
    name: Build on ${{ matrix.os }} py3.${{ matrix.python3-version }}
    # continue-on-error: true 
    continue-on-error: ${{ matrix.python3-version != '13' }}
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 15
    strategy:
      matrix:
        os: [macos, windows, ubuntu]
        # os: [macos, windows]
        python3-version: ["11", "12", "13", "14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # - name: Cache pip
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.cache/pip
      #     key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}-py${{ matrix.python-version }}

      # For macOS, run a no-op command
      - name: Install dependencies on macOS
        if: matrix.os == 'macos'
        run: |
          echo "No dependencies to install on macOS."

      # For Windows, run a no-op command
      - name: Install dependencies on Windows
        if: matrix.os == 'windows'
        run: |
          echo "No dependencies to install on Windows."

      # Install system dependencies for Ubuntu
      - name: Install dependencies on Ubuntu
        if: matrix.os == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            xvfb \
            x11-utils \
            libopengl0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.${{ matrix.python3-version }}
          cache: 'pip'

      - name: Install dependencies 
        shell: bash
        run: |
          python -m venv venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            source venv/Scripts/activate
          else
            source venv/bin/activate
          fi
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pip install --force-reinstall -r requirements.txt
          pip install -e .

      - name: Build with PyInstaller
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            source venv/Scripts/activate
          else
            source venv/bin/activate
          fi
          pyinstaller HeLab.spec --clean -y

      - name: Archive build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.os }}-py3${{ matrix.python3-version }}
          # name: build-${{ matrix.os }}-py${{ format('{0}', matrix.python-version) | replace('.','') }}
          # name: build-${{ matrix.os }}-py${{ replace(matrix.python-version, '.', '') }}
          # name: build-${{ matrix.os }}-py${{ join(split(matrix.python-version, '.'), '') }}
          path: |
            dist/
          retention-days: 1
      - name: Check Python 3.13 Test Results
        if: matrix.python3-version == '13' && failure()
        run: exit 1

  release:
    name: Create Release on Tag
    needs: [get-version, test, build]
    if: needs.get-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: build-macos-py313
          path: dist/macos

      - name: Download Windows Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: build-windows-py313
          path: dist/windows

      - name: Download Ubuntu Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: build-ubuntu-py313
          path: dist/ubuntu

      - name: Compress macOS Build Artifact
        run: |
          cd dist/macos
          zip -r -9 HeLab-macos.zip HeLab.app HeLab

      - name: Compress Windows Build Artifact
        run: |
          cd dist/windows
          zip -r -9 HeLab-windows.zip HeLab
          
      - name: Compress Ubuntu Build Artifact
        run: |
          cd dist/ubuntu
          zip -r -9 HeLab-ubuntu.zip HeLab

      - name: Prepare Release Body
        run: |
          RELEASE_BODY="## Release ${{ needs.get-version.outputs.tag_name }}

          **Date:** $(date +'%Y-%m-%d %H:%M') UTC

          **Commit:** [${{ github.sha }}](${{ github.event.repository.url }}/commit/${{ github.sha }})

          **Workflow Run:** [View Details](${{ github.event.repository.url }}/actions/runs/${{ github.run_id }})

          ### Build Artifacts

          - **macOS ARM64** build (Python 3.13)
          - **Windows Intel64** build (Python 3.13)
          - **Ubuntu Intel64** build (Python 3.13)

          **Note:** This is an automated release. Please verify builds before production use."

          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          echo "$RELEASE_BODY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "Release body preview:"
          echo "$RELEASE_BODY"

      - name: Create Release and Upload Assets on Version Bump
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.get-version.outputs.tag_name }}
          commit: ${{ github.sha }}
          name: "Automated Release ${{ needs.get-version.outputs.tag_name }}"
          body: ${{ env.RELEASE_BODY }}
          draft: true
          prerelease: true
          artifacts: |
            dist/macos/HeLab-macos.zip
            dist/windows/HeLab-windows.zip
            dist/ubuntu/HeLab-ubuntu.zip

